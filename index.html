<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>梦间</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <section class="home" id="home">
        <div class="home-bg" id="homeBg"></div>
        <div class="home-aurora"></div>
        <div class="home-grain"></div>
        <div class="home-inner">
          <header class="home-top">
            <div class="home-date" id="homeDate"></div>
            <button class="glass-btn" id="editHomeBtn" aria-label="整理桌面"></button>
          </header>

          <div class="home-hero">
            <div class="home-clock" id="homeClock">--:--</div>
            <div class="home-greeting" id="homeGreeting"></div>
            <div class="home-profile" id="homeProfile"></div>
          </div>

          <div class="app-grid" id="appGrid"></div>

          <div class="home-footer">
            <span class="home-footer-line"></span>
            <span class="home-footer-mark" id="homeFooterMark">M</span>
            <span class="home-footer-line"></span>
          </div>
        </div>
      </section>

      <section class="app-layer" id="appLayer" aria-live="polite"></section>

      <div class="sheet-host" id="sheetHost" hidden></div>
      <div class="toast-host" id="toastHost"></div>
    </div>
  </div>

  <div class="intro" id="intro">
    <div class="intro-sky">
      <div class="intro-stars" id="introStars"></div>
      <div class="intro-halo halo-one"></div>
      <div class="intro-halo halo-two"></div>
      <div class="intro-moon">
        <svg viewBox="0 0 240 240" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="moonGrad" x1="42" y1="30" x2="198" y2="216" gradientUnits="userSpaceOnUse">
              <stop stop-color="#f7f2e9"/>
              <stop offset=".55" stop-color="#d9d0c4"/>
              <stop offset="1" stop-color="#8f857b"/>
            </linearGradient>
            <radialGradient id="moonGlow" cx="0" cy="0" r="1" gradientTransform="translate(120 120) rotate(90) scale(118)" gradientUnits="userSpaceOnUse">
              <stop stop-color="#fff" stop-opacity=".22"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="120" cy="120" r="118" fill="url(#moonGlow)"/>
          <path class="moon-shape" d="M155.5 38.8c-15.2 9.4-26.7 24.2-31.9 41.7-8.1 27.4 3.1 56.8 26.7 71.5 15.4 9.6 34.1 12.4 51.2 8.3-13.8 20.5-35.6 34.8-61.1 38.2-44.3 5.9-85-25.2-90.9-69.5C43.6 84.7 74.7 44 119 38.1c12.4-1.7 24.5-.4 36.5 2.7Z" fill="url(#moonGrad)"/>
          <path class="moon-line" d="M57 70c17-28 47-46 81-46" stroke="#f7f2e9" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="120" cy="120" r="106" stroke="#fff" stroke-opacity=".12" stroke-width=".8" stroke-dasharray="2 7"/>
        </svg>
      </div>
      <div class="intro-orbit orbit-one"></div>
      <div class="intro-orbit orbit-two"></div>
    </div>

    <div class="intro-copy">
      <div class="intro-kicker">DREAM TRANSMISSION</div>
      <h1 class="intro-title">梦<span>间</span></h1>
      <p class="intro-line" id="introLine">正在靠近</p>
      <div class="intro-progress"><span></span></div>
    </div>
    <div class="intro-veil"></div>
  </div>

  <input type="file" id="globalFile" hidden>
  <script src="app.js"></script>
</body>
</html>
